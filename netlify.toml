# Netlify CI/CD — frontend
# GitHub'ga push qilinganda Netlify frontend/ papkani avtomatik build qilib chiqaradi.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------
# API proxy: sayt /api/... so'rovlarini Render'dagi backend'ga yo'naltiradi.
# DIQQAT: Render'da servis yaratganingizdan keyin quyidagi URL'ni
# o'zingizning haqiqiy Render URL'ingizga almashtiring!
# ---------------------------------------------------------------

[[redirects]]
  from = "/api/*"
  to = "https://sifat-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://sifat-api.onrender.com/uploads/:splat"
  status = 200
  force = true

# SPA fallback — /admin va boshqa client-side route'lar uchun shart.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
